<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a0d"><title>IPTV Web Player</title><script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script><style>
:root{--bg:#080a0d;--side:#101318;--card:#171b21;--hover:#202630;--line:#2b323c;--txt:#f1f4f7;--muted:#929daa;--red:#e50914}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Segoe UI,Tahoma,Arial,sans-serif;overflow:hidden}.app{height:100vh;display:grid;grid-template-columns:350px 1fr}.sidebar{background:var(--side);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.head{height:64px;padding:0 17px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.logoText{font-size:19px;font-weight:800}.logoText i{font-style:normal;color:var(--red)}.count{font-size:11px;color:var(--muted)}.search{padding:10px;border-bottom:1px solid var(--line)}input[type=search]{width:100%;background:#0a0d10;border:1px solid var(--line);color:var(--txt);padding:10px 12px;border-radius:8px;outline:none}.groups{display:flex;gap:6px;padding:9px;overflow:auto;border-bottom:1px solid var(--line);scrollbar-width:thin}.chip{border:1px solid var(--line);background:#15191f;color:var(--muted);padding:6px 10px;border-radius:999px;white-space:nowrap;font-size:11px;cursor:pointer}.chip.active{background:#2a3039;color:#fff;border-color:#4a535f}.list{overflow:auto;padding:7px;scrollbar-width:thin}.item{height:59px;display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer}.item:hover{background:var(--hover)}.item.active{background:#252b34}.fav{color:#66717e;font-size:16px;width:18px;text-align:center}.fav.on{color:#f5c542}.chanLogo{width:40px;height:40px;border-radius:6px;object-fit:contain;background:#090b0e;flex:none}.info{min-width:0;flex:1}.name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.group{font-size:10px;color:var(--muted);margin-top:3px}.main{display:flex;flex-direction:column;min-width:0;background:#000}.bar{height:58px;background:var(--side);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 17px;gap:15px}.title{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.state{font-size:11px;color:var(--muted);white-space:nowrap}.stage{flex:1;position:relative;background:#000;min-height:0;display:flex;align-items:center;justify-content:center}.stage video{width:100%;height:100%;object-fit:contain;background:#000}.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#77818d;gap:8px}.empty strong{font-size:22px;color:#dfe4e9}.bottom{background:var(--side);border-top:1px solid var(--line);padding:9px 13px}.now{display:flex;align-items:center;gap:9px;margin-bottom:8px;font-size:13px}.controls{display:flex;align-items:center;gap:6px}.btn{background:#171c22;border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:7px 10px;cursor:pointer}.btn:hover{background:var(--hover)}input[type=range]{width:100px}.kbd{margin-right:auto;color:#6f7b88;font-size:10px}.toast{position:absolute;bottom:100px;left:20px;background:#161b21;border:1px solid var(--line);padding:10px 13px;border-radius:8px;font-size:12px;display:none;z-index:5}.loading{opacity:.65}.hidden{display:none!important}@media(max-width:800px){body{overflow:auto}.app{height:100vh;grid-template-columns:1fr;grid-template-rows:55vh 45vh}.main{grid-row:1}.sidebar{grid-row:2;border-left:0;border-top:1px solid var(--line)}.bar{height:48px}.kbd{display:none}}
</style></head><body><div class="app"><aside class="sidebar"><div class="head"><div class="logoText">IPTV <i>WEB</i></div><div id="count" class="count">Loading...</div></div><div class="search"><input id="search" type="search" placeholder="جستجوی شبکه یا گروه..." autocomplete="off"></div><div id="groups" class="groups"></div><div id="list" class="list"></div></aside><main class="main"><div class="bar"><div id="title" class="title">یک شبکه انتخاب کنید</div><div id="state" class="state">در حال دریافت Playlist...</div></div><div class="stage"><video id="video" controls playsinline preload="metadata"></video><div id="empty" class="empty"><strong>IPTV WEB PLAYER</strong><span>یک شبکه را از لیست انتخاب کنید</span></div><div id="toast" class="toast"></div></div><div class="bottom"><div class="now">▶ <span id="now">هیچ کانالی انتخاب نشده</span></div><div class="controls"><button class="btn" id="prev">قبلی</button><button class="btn" id="play">پخش</button><button class="btn" id="next">بعدی</button><button class="btn" id="stop">توقف</button><button class="btn" id="mute">بی‌صدا</button><input id="volume" type="range" min="0" max="1" step=".01" value="1"><button class="btn" id="favBtn">☆</button><button class="btn" id="full">تمام صفحه</button><span class="kbd">↑ ↓ کانال · Space پخش</span></div></div></main></div><script>
const video=document.getElementById('video'),listEl=document.getElementById('list'),groupsEl=document.getElementById('groups'),searchEl=document.getElementById('search'),stateEl=document.getElementById('state'),titleEl=document.getElementById('title'),nowEl=document.getElementById('now'),emptyEl=document.getElementById('empty'),toast=document.getElementById('toast'),countEl=document.getElementById('count');let channels=[],filtered=[],currentIndex=-1,current=null,hls=null,group='ALL',favorites=JSON.parse(localStorage.getItem('iptv-favs')||'[]'),retry=0;
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function parseM3U(t){let a=t.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),out=[];for(let i=0;i<a.length;i++){if(!a[i].startsWith('#EXTINF'))continue;let l=a[i],url=a.slice(i+1).find(x=>x&&!x.startsWith('#'))||'';let comma=l.indexOf(',');let name=comma>=0?l.slice(comma+1).trim():'Unknown';let attr=k=>{let m=l.match(new RegExp(k+'="([^"]*)"','i'));return m?m[1]:''};out.push({name:name||attr('tvg-name')||'Unknown',group:attr('group-title')||'Undefined',logo:attr('tvg-logo'),url})}return out.filter(x=>x.url)}
function uniqueGroups(){return [...new Set(channels.map(x=>x.group))].sort()}
function renderGroups(){groupsEl.innerHTML='';[['ALL','همه'],['FAV','علاقه‌مندی'] ,...uniqueGroups().map(x=>[x,x])].forEach(([id,label])=>{let b=document.createElement('button');b.className='chip '+(group===id?'active':'');b.textContent=label;b.onclick=()=>{group=id;renderGroups();apply()};groupsEl.appendChild(b)})}
function apply(){let q=searchEl.value.toLowerCase().trim();filtered=channels.filter(c=>(group==='ALL'||(group==='FAV'?favorites.includes(c.url):c.group===group))&&(!q||c.name.toLowerCase().includes(q)||c.group.toLowerCase().includes(q)));countEl.textContent=filtered.length+' کانال';renderList()}
function renderList(){listEl.innerHTML='';filtered.forEach((c,i)=>{let d=document.createElement('div');d.className='item '+(current&&current.url===c.url?'active':'');d.innerHTML=`<span class="fav ${favorites.includes(c.url)?'on':''}">${favorites.includes(c.url)?'★':'☆'}</span><img class="chanLogo" src="${esc(c.logo)}" onerror="this.style.visibility='hidden'"><div class="info"><div class="name">${esc(c.name)}</div><div class="group">${esc(c.group)}</div></div>`;d.onclick=e=>{if(e.target.classList.contains('fav')){toggleFav(c);return}playChannel(c,i)};listEl.appendChild(d)})}
function toggleFav(c){favorites=favorites.includes(c.url)?favorites.filter(x=>x!==c.url):[...favorites,c.url];localStorage.setItem('iptv-favs',JSON.stringify(favorites));renderList()}
function cleanup(){if(hls){hls.destroy();hls=null}video.pause();video.removeAttribute('src');video.load()}
function playChannel(c,idx){cleanup();current=c;currentIndex=idx;retry=0;titleEl.textContent=c.name;nowEl.textContent=c.name;stateEl.textContent='در حال اتصال...';emptyEl.classList.add('hidden');renderList();let u=c.url;if(window.Hls&&Hls.isSupported()&&/\.m3u8(?:\?|$)/i.test(u)){hls=new Hls({enableWorker:true,lowLatencyMode:true,maxBufferLength:30});hls.loadSource(u);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>{stateEl.textContent='● متصل';video.play().catch(()=>{})});hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal){stateEl.textContent='خطا؛ تلاش مجدد...';autoRetry()}})}else{video.src=u;video.play().catch(()=>{});video.onloadedmetadata=()=>stateEl.textContent='● متصل';video.onerror=()=>{stateEl.textContent='خطای پخش';autoRetry()}}}
function autoRetry(){if(retry>=2){stateEl.textContent='استریم در دسترس نیست';return}retry++;setTimeout(()=>{if(current)playChannel(current,currentIndex)},1500)}
function next(dir){if(!filtered.length)return;let i=currentIndex<0?0:(currentIndex+dir+filtered.length)%filtered.length;playChannel(filtered[i],i)}
searchEl.oninput=apply;document.getElementById('play').onclick=()=>video.play().catch(()=>{});document.getElementById('stop').onclick=()=>{cleanup();stateEl.textContent='متوقف';emptyEl.classList.remove('hidden')};document.getElementById('prev').onclick=()=>next(-1);document.getElementById('next').onclick=()=>next(1);document.getElementById('mute').onclick=()=>{video.muted=!video.muted;document.getElementById('mute').textContent=video.muted?'با صدا':'بی‌صدا'};document.getElementById('volume').oninput=e=>video.volume=+e.target.value;document.getElementById('full').onclick=()=>document.querySelector('.stage').requestFullscreen?.();document.getElementById('favBtn').onclick=()=>current&&toggleFav(current);
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowDown')next(1);if(e.key==='ArrowUp')next(-1);if(e.code==='Space'){e.preventDefault();video.paused?video.play():video.pause()}});
fetch('/api/playlist').then(r=>{if(!r.ok)throw Error();return r.text()}).then(t=>{channels=parseM3U(t);renderGroups();apply();stateEl.textContent=channels.length+' کانال آماده است'}).catch(()=>{stateEl.textContent='خطا در Playlist';toast.textContent='فایل M3U پیدا نشد';toast.style.display='block'});
</script></body></html>
